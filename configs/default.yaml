# =============================================================================
# Pipeline configuration — LLM Adversarial Judge Exploitation
# =============================================================================
# Every key here maps to a dataclass in src/config.py. Unknown keys raise
# TypeError at load time (intentional — catches config drift early).
# =============================================================================

seed: 42

paths:
  test_csv: /kaggle/input/competitions/llms-you-cant-please-them-all/test.csv                        # Revise to your actual file path
  submission_csv: outputs/submission.csv
  words_json: outputs/generated_words.json
  attacks_json: outputs/attacks.json
  scores_json: outputs/scores.json

generation:
  vocab:
    model: Qwen/Qwen2.5-3B-Instruct
    n_iterations: 100        # For testing can set to 10 or 20, but for final runs use 100.
    max_new_tokens: 2000     # For testing can set to 500, but for final runs use 2000.
    temperature: 1.2
    top_p: 0.95
    target_size: 1000        # For testing can set to 100, but for final runs use 1000.
    min_word_len: 6
    # If the pool does not grow for this many consecutive iterations,
    # stop early instead of burning GPU time.
    patience: 5              # For testing can set to 2, but for final runs use 5.

  nonsense:
    model: meta-llama/Llama-3.1-8B-Instruct
    max_new_tokens: 1000
    temperature: 0.9
    top_p: 0.95
    n_words: 100

  exploits:
    examples_per_type: 5

  baseline:
    temperature: 0.2
    instructions: []          # currently unused; BASELINE_INSTRUCTIONS is in code

  essay_max_chars: 900

evaluation:
  committee:
    - google/gemma-2-2b-it
    - Qwen/Qwen3-4B-Instruct-2507
    - meta-llama/Llama-3.1-8B-Instruct
    - microsoft/Phi-3.5-mini-instruct
  max_input_tokens: 4096
  max_new_tokens: 10
  default_score: 4.5
  similarity_floor: 0.2
  # Use eager attention by default to avoid flash-attn version mismatches.
  attn_implementation: eager