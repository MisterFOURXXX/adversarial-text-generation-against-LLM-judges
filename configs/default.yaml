# =============================================================================
# Pipeline configuration — LLM Adversarial Judge Exploitation
# =============================================================================
# Every key here maps to a dataclass in src/config.py. Unknown keys raise
# TypeError at load time (intentional — catches config drift early).
# =============================================================================

seed: 42

paths:
  test_csv: /kaggle/input/competitions/llms-you-cant-please-them-all/test.csv                        # Revise to your actual file path
  submission_csv: outputs/submission.csv
  words_json: outputs/generated_words.json
  attacks_json: outputs/attacks.json
  scores_json: outputs/scores.json

generation:
  vocab:
    model: Qwen/Qwen2.5-3B-Instruct
    n_iterations: 10  #100
    max_new_tokens: 200  #2000
    temperature: 1.2
    top_p: 0.95
    target_size: 10  #1000
    min_word_len: 6

  nonsense:
    model: meta-llama/Llama-3.1-8B-Instruct
    max_new_tokens: 100
    temperature: 0.9
    top_p: 0.95
    n_words: 100

  exploits:
    # Number of pre-generated examples per exploit type. Pools are cycled
    # across the submission.
    examples_per_type: 5

  baseline:
    # Baseline instruction templates live in src/generation/baseline.py
    # (BASELINE_INSTRUCTIONS). This block documents the shared temperature.
    temperature: 0.2

  essay_max_chars: 900

evaluation:
  committee:
    - google/gemma-2-2b-it
    - Qwen/Qwen3-4B-Instruct-2507
    - meta-llama/Llama-3.1-8B-Instruct
    - microsoft/Phi-3.5-mini-instruct
  max_input_tokens: 4096
  max_new_tokens: 10
  default_score: 4.5
  similarity_floor: 0.2